# ==================== Spring Application Configuration ====================
# Application name - used in logs and Spring Boot Banner
spring.application.name=library

# ==================== PostgreSQL Database Configuration ====================
# JDBC connection URL for PostgreSQL
# Format: jdbc:postgresql://[host]:[port]/[database_name]
# localhost:5432 - PostgreSQL default host and port
# digital_library - Database name (create this manually or let Hibernate create it)
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_library

# Database username - default PostgreSQL username is 'postgres'
spring.datasource.username=postgres

# Database password - default PostgreSQL password for 'postgres' user
# Change this to your actual PostgreSQL password if different
spring.datasource.password=postgres

# ==================== JPA (Hibernate) Configuration ====================
# DDL Auto configuration
# update - Hibernate will validate schema on startup and update if needed
#          Creates tables if they don't exist
#          Adds new columns if entity fields are added
#          Note: Does not drop tables or columns
# Other options:
#   create - Drop existing tables and create new ones (use with caution!)
#   create-drop - Create tables on startup, drop on shutdown (development only)
#   validate - Just validate schema, fail if mismatch (production)
#   none - Do nothing with DDL
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed by Hibernate
# true - Prints all SQL queries to console (useful for debugging)
# false - Disables SQL query logging
spring.jpa.show-sql=true

# Format SQL queries for better readability in console logs
spring.jpa.properties.hibernate.format_sql=true

# Database dialect - tells Hibernate to use PostgreSQL-specific SQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==================== Server Configuration ====================
# Server port - Port on which the Spring Boot application will run
# Default Spring Boot port is 8080
# Access API at: http://localhost:8080/books
server.port=8080

# ==================== Logging Configuration ====================
# Set logging level for Spring Boot
# INFO - Shows info level logs (startup messages, configuration, etc.)
logging.level.root=INFO

# Set logging level for org.springframework package (Spring Framework)
logging.level.org.springframework=INFO

# Set logging level for Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================== Additional Spring Boot Configuration ====================
# Enable detailed error responses
server.error.include-message=always
server.error.include-binding-errors=always

# Enable graceful shutdown (server waits for requests to complete)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
